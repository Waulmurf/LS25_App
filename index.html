<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hof Koprek Manager</title>
<style>
:root{
  --bg:#f4f1ea; --panel:#fffdf8; --panel2:#f0ebe0; --ink:#26241f; --muted:#6d685c; --line:#ddd5c4;
  --accent:#2f6b3a; --accent-ink:#fff; --warn:#a4560f; --warn-bg:#fbeedd; --bad:#a3302a; --bad-bg:#f9e3e1;
  --ok:#2f6b3a; --ok-bg:#e3f0e2; --chip:#ebe5d8; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
  --c-K:#b07a1f; --c-WW:#c9a227; --c-WR:#8d7a3c; --c-Z:#a2467a; --c-E:#4f8a3a; --c-ZR:#6b5fa8; --c-SM:#3d7f86; --c-RT:#c0521f; --c-G:#5d8f45; --c-H:#7a7266;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191a17; --panel:#22231f; --panel2:#2a2b26; --ink:#ebe7dc; --muted:#a39d8f; --line:#3a3a33;
    --accent:#6fb07a; --accent-ink:#10200f; --warn:#e6a35a; --warn-bg:#3a2b19; --bad:#ec8a83; --bad-bg:#3d2220;
    --ok:#7cc387; --ok-bg:#1f3322; --chip:#33342d; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#191a17; --panel:#22231f; --panel2:#2a2b26; --ink:#ebe7dc; --muted:#a39d8f; --line:#3a3a33;
  --accent:#6fb07a; --accent-ink:#10200f; --warn:#e6a35a; --warn-bg:#3a2b19; --bad:#ec8a83; --bad-bg:#3d2220;
  --ok:#7cc387; --ok-bg:#1f3322; --chip:#33342d; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header.top h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.01em}
header.top .date{font-weight:600;color:var(--accent)}
header.top .spacer{flex:1}
nav.tabs{display:flex;gap:4px;padding:8px 16px 0;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--panel)}
nav.tabs button{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);white-space:nowrap}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:15px;margin:0 0 10px;font-weight:650}
.card h3{font-size:14px;margin:14px 0 6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--panel2);padding:6px 11px;border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.small{padding:3px 8px;font-size:13px}
.btn.danger{color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:999px;background:var(--chip);font-size:12.5px;border:1px solid transparent;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%}
button.chip{cursor:pointer}
.chip.done{text-decoration:line-through;opacity:.55}
.chip.rt{border-color:var(--c-RT)}
.tag{font-size:11.5px;padding:1px 6px;border-radius:5px;background:var(--chip);color:var(--muted);white-space:nowrap}
.tag.lu{background:#e6effa;color:#24508a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.lu{background:#1f2c3d;color:#9cc0ec}}
:root[data-theme="dark"] .tag.lu{background:#1f2c3d;color:#9cc0ec}
.tag.frist{background:var(--bad-bg);color:var(--bad);font-weight:600}
.tag.auto{background:var(--ok-bg);color:var(--ok)}
.tag.fungi{background:var(--warn-bg);color:var(--warn)}
.big{font-size:26px;font-weight:700;line-height:1.15}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.status{padding:2px 8px;border-radius:6px;font-size:13px;font-weight:600;display:inline-block}
.status.ok{background:var(--ok-bg);color:var(--ok)}
.status.warn{background:var(--warn-bg);color:var(--warn)}
.status.bad{background:var(--bad-bg);color:var(--bad)}
.alert{padding:9px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:14px;margin-bottom:10px}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
.alert.ok{background:var(--ok-bg);color:var(--ok)}
.task{display:grid;grid-template-columns:28px 64px 1fr;gap:4px 8px;padding:9px 4px;border-top:1px solid var(--line);align-items:start}
.task:first-child{border-top:0}
.task.noday{grid-template-columns:28px 1fr}
.task.isdone .ttext{color:var(--muted);text-decoration:line-through}
.task.now{background:color-mix(in srgb,var(--accent) 7%,transparent);border-radius:6px}
.task .day{font-weight:600;font-size:13px;color:var(--muted);padding-top:2px}
.task .chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.task input[type=checkbox]{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent);cursor:pointer}
.task .meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;align-items:center}
.task textarea{width:100%;min-height:52px;margin-top:6px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:6px}
.linkbtn{background:none;border:0;color:var(--muted);cursor:pointer;font-size:12.5px;padding:0;text-decoration:underline}
.bar{height:8px;border-radius:5px;background:var(--chip);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12.5px;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.cur{outline:2px solid var(--accent);outline-offset:-2px;border-radius:5px}
.monthnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.monthnav .title{font-size:19px;font-weight:700;min-width:220px}
select,input[type=number],input[type=text]{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:5px 7px}
input[type=number]{width:80px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.empty{color:var(--muted);padding:14px 4px;font-size:14px}
pre{white-space:pre-wrap;word-break:break-all;font-size:12px;background:var(--panel2);padding:8px;border-radius:6px;max-height:320px;overflow:auto}
details summary{cursor:pointer}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:14px;z-index:20;max-width:92vw}
@media (max-width:560px){
  .task{grid-template-columns:26px 1fr}
  .task .day{grid-column:2}
  .task .body{grid-column:1 / span 2}
  .monthnav .title{min-width:0;font-size:17px}
}
</style>
</head>

/* =====================================================================
   Zeitrechnung
   Das FS-Jahr beginnt im März: Januar/Februar gehören noch zum laufenden Jahr.
   abs = (Jahr-1)*12 + Index (März=0 … Februar=11).
   Planjahr = Jahr-1 von März bis Dezember; Januar/Februar bereiten schon das
   nächste Planjahr vor (Planjahr = Jahr).
   ===================================================================== */
const mIdx = m => (m+9)%12;
const toAbs = (year, month) => (year-1)*12 + mIdx(month);
const fromAbs = abs => { const sy = Math.floor(abs/12)+1, mi = ((abs%12)+12)%12; const month = (mi+2)%12+1; return {sy, month, year: sy, pj: month<=2 ? sy : sy-1}; };
const step = pj => (((pj-1)%4)+4)%4+1;
const nowAbs = () => toAbs(state.game.year, state.game.month);
// Welche Plantage (T1–T4) der aktuelle Spieltag abdeckt. Bei 1 Tag je Monat: T1–T4.
const dayWindow = () => { const {day,dpp} = state.game; const lo = Math.min(4, Math.floor((day-1)*4/dpp)+1), hi = Math.min(4, Math.max(lo, Math.ceil(day*4/dpp))); return [lo,hi]; };
const planDay = () => dayWindow()[0];
const isToday = t => { const [lo,hi] = dayWindow(); return t.abs===nowAbs() && t.d[0]<=hi && t.d[1]>=lo; };
const dayLabel = d => d[0]===d[1] ? 'T'+d[0] : 'T'+d[0]+'–'+d[1];
const fmtDate = (g=state.game) => `${MONTHS[g.month]} · T${g.day}${g.dpp!==4?'/'+g.dpp:''} · Jahr ${g.year}`;
function pjLabel(abs){
  const {pj} = fromAbs(abs);
  if(abs < START_ABS) return 'vor Planstart';
  if(pj===0) return 'Startphase (bereitet Planjahr 1 vor)';
  return `Planjahr ${pj} · Schritt ${step(pj)} von 4`;
}

/* =====================================================================
   Felder & Fruchtfolge
   ===================================================================== */
const fieldHa = f => state.haOverride[f.id] ?? f.ha;
function cropOf(f, pj){ if(pj<1) return null; return LINES[f.line][(f.group-1 + pj-1)%4]; }
function rtSlot(pj){ return state.rt[step(pj)]; }
const ownIds = new Set([...FIELDS.map(f=>f.id), ...SPECIAL.map(f=>f.id)]);
const fieldById = id => FIELDS.find(f=>f.id===id);

function resolveSel(sel, pj){
  if(!sel) return [];
  if(sel.place) return [{place:sel.place}];
  const out = [];
  if(sel.fixed) sel.fixed.forEach(id=>{ const f = fieldById(id) || SPECIAL.find(s=>s.id===id); out.push({id, ha: f ? (fieldById(id)?fieldHa(f):f.ha) : null, crop: f && f.line ? cropOf(f,pj) : null}); });
  if(sel.allOwn) FIELDS.forEach(f=>out.push({id:f.id, ha:fieldHa(f), crop:cropOf(f,pj)}));
  if(sel.cur || sel.next || sel.nextSpring){
    let list = FIELDS.slice();
    if(sel.cur) list = list.filter(f=>sel.cur.includes(cropOf(f,pj)));
    if(sel.next) list = list.filter(f=>sel.next.includes(cropOf(f,pj+1)));
    if(sel.nextSpring) list = list.filter(f=>CROPS[cropOf(f,pj+1)].spring);
    if(sel.notCur) list = list.filter(f=>!sel.notCur.includes(cropOf(f,pj)));
    if(sel.nearest && list.length) list = [list.slice().sort((a,b)=>a.dist-b.dist)[0]];
    list.forEach(f=>out.push({id:f.id, ha:fieldHa(f), crop: sel.next ? cropOf(f,pj+1) : cropOf(f,pj)}));
  }
  if(sel.rt){ const s = rtSlot(sel.rt==='next' ? pj+1 : pj); if(s && s.field) out.push({id:s.field, ha:s.ha, crop:'K', rt:true}); }
  if(sel.rtAll) [1,2,3,4].forEach(k=>{ const s = state.rt[k]; if(s && s.field) out.push({id:s.field, ha:s.ha, crop:'K', rt:true, rtYear:k}); });
  return out;
}

/* Aufgaben eines Monats (abs) */
function tasksFor(abs){
  if(abs < START_ABS) return [];
  const {sy, month, pj} = fromAbs(abs);
  const list = [];
  if(sy===1 && month>=8){
    START.filter(t=>t.m===month).forEach(t=>list.push(mk(t, abs, resolveSel(t.sel, 1))));
    if(month>=9) list.push(mk(Object.assign({},FEEDING,{m:month}), abs, resolveSel(FEEDING.sel,1)));
  } else {
    list.push(mk(Object.assign({},FEEDING,{m:month}), abs, resolveSel(FEEDING.sel,pj)));
    CALENDAR.filter(t=>t.m===month && !(t.skipPj1 && pj===1)).forEach(t=>list.push(mk(t, abs, resolveSel(t.sel, pj))));
  }
  state.custom.filter(c=> (c.repeat ? c.month===month && abs>=START_ABS : c.abs===abs)).forEach(c=>{
    list.push(mk({id:'c-'+c.id, m:month, d:[c.day,c.day], text:c.text, who:c.who||'selbst', custom:c}, abs, (c.fields||[]).map(id=>({id, ha:(fieldById(id)?fieldHa(fieldById(id)):null), crop: fieldById(id)?cropOf(fieldById(id), Math.max(1,pj)):null, rt:!ownIds.has(id)}))));
  });
  list.sort((a,b)=>a.d[0]-b.d[0] || a.d[1]-b.d[1]);
  return list;
}
function mk(t, abs, targets){
  const fields = targets.filter(x=>x.id!=null);
  return Object.assign({}, t, {abs, key:abs+'|'+t.id, targets, fields});
}
const doneKey = (task, fid) => task.key + '|' + (fid ?? '-');
function isFieldDone(task, fid){ return !!state.done[doneKey(task,fid)]; }
function taskProgress(task){
  if(!task.fields.length) return isFieldDone(task,null) ? [1,1] : [0,1];
  const n = task.fields.filter(f=>isFieldDone(task,f.id)).length;
  return [n, task.fields.length];
}
const isTaskDone = t => { const [a,b] = taskProgress(t); return a===b; };
function isAuto(task){
  if(!task.fields.length) return state.done[doneKey(task,null)]?.auto;
  return task.fields.some(f=>state.done[doneKey(task,f.id)]?.auto);
}
function overdueTasks(){
  const now = nowAbs(), pd = planDay(), out = [];
  for(let a = START_ABS; a <= now; a++){
    tasksFor(a).forEach(t=>{ if(isTaskDone(t)) return; if(a<now || t.d[1] < pd) out.push(t); });  // pd = erster Plantag von heute
  }
  return out;
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtHa = n => n==null ? '' : n.toLocaleString('de-DE',{minimumFractionDigits:1, maximumFractionDigits:2})+' ha';
const fmtMoney = n => n==null ? '–' : Math.round(n).toLocaleString('de-DE')+' €';
const cropDot = c => c ? `<span class="dot" style="background:var(--c-${c})"></span>` : '';
const cropName = c => c ? CROPS[c].name : '';

  document.getElementById('tabs').innerHTML = TABS.map(([k,l])=>`<button class="${state.ui.tab===k?'on':''}" data-action="tab" data-tab="${k}">${l}</button>`).join('');

}

  return `<table><tr><th>Einstellung</th><th>Spielstand</th><th>Plan</th><th></th></tr>
    ${row('Tage je Monat', state.sync.env?.dpp, PLAN_SETTINGS.dpp, state.sync.env?.dpp===PLAN_SETTINGS.dpp)}
    ${row('Wirtschaft', s.econ, PLAN_SETTINGS.econ, s.econ===PLAN_SETTINGS.econ)}
    ${row('Steine', s.stones==null?null:(s.stones?'an':'aus'), 'aus', s.stones===false)}

}

const FILL_DE = {POTATO:'Kartoffeln', WHEAT:'Weizen', RYE:'Roggen', SUGARBEET:'Zuckerrüben', SUGARBEET_CUT:'Rübenschnitzel', SILAGE:'Silage', CHAFF:'Häckselgut', MAIZE:'Mais', PEA:'Erbsen', PEAS:'Erbsen', ONION:'Zwiebeln', DRYGRASS_WINDROW:'Heu', GRASS_WINDROW:'Gras', STRAW:'Stroh', LIQUIDMANURE:'Gülle', MANURE:'Mist', FORAGE:'TMR', FERTILIZER:'Dünger', LIQUIDFERTILIZER:'Flüssigdünger', LIME:'Kalk', HERBICIDE:'Herbizid', FUNGICIDE:'Fungizid', SEEDS:'Saatgut', DIESEL:'Diesel', DEF:'AdBlue', WATER:'Wasser', MILK:'Milch', OILSEEDRADISH:'Ölrettich'};
function stockList(){
  const st = state.sync?.stock;
  if(!st) return '<p class="muted small">Kommt beim Sync aus den Lagern deines Betriebs (placeables.xml).</p>';
  const rows = Object.entries(st).sort((a,b)=>b[1]-a[1]);
  if(!rows.length) return '<p class="muted small">Alle Lager sind leer.</p>';
  return '<table>'+rows.map(([ft,l])=>`<tr><td>${esc(FILL_DE[ft]||ft)}</td><td class="num">${Math.round(l).toLocaleString('de-DE')} l</td></tr>`).join('')+'</table>';
}
function cropSummary(pj){
  const m = {};
  FIELDS.forEach(f=>{ const c = cropOf(f,pj); (m[c] ||= [0,[]]); m[c][0]+=fieldHa(f); m[c][1].push(f.id); });
  const rt = rtSlot(pj); if(rt?.field){ (m.K ||= [0,[]]); m.K[0]+=rt.ha||0; m.K[1].push('RT '+rt.field); }
  return Object.keys(CROPS).filter(c=>m[c]).map(c=>[c, m[c][0], m[c][1]]);
}

function taskRow(t, compact=false, showMonth=false, noDay=false){
  const [a,b] = taskProgress(t), done = a===b;
  const isNow = isToday(t);
  const haSum = t.fields.reduce((s,f)=>s+(f.ha||0),0);
  const who = t.who==='LU' || t.who==='LU + selbst' ? `<span class="tag lu">${esc(t.who)}</span>` : `<span class="tag">${esc(t.who)}</span>`;
  const place = t.targets.find(x=>x.place);
  const chips = t.fields.map(f=>{
    const d = isFieldDone(t,f.id);
    return `<button class="chip ${f.rt?'rt':''} ${d?'done':''}" data-action="toggleField" data-key="${esc(t.key)}" data-fid="${f.id}" title="${f.rt?'Ringtausch-Feld':'Feld'} ${f.id}${f.crop?' · '+cropName(f.crop):''} – zum Abhaken klicken">${cropDot(f.crop)}${f.rt?'RT ':''}${f.id}${f.ha?` <span class="muted">${f.ha.toLocaleString('de-DE',{maximumFractionDigits:1})}</span>`:''}</button>`;
  }).join('');
  const note = state.notes[t.key];
  const {month, year} = fromAbs(t.abs);
  return `<div class="task ${done?'isdone':''} ${isNow?'now':''} ${noDay?'noday':''}">
    <input type="checkbox" ${done?'checked':''} data-action="toggleTask" data-key="${esc(t.key)}" aria-label="Erledigt">
    ${noDay?'':`<div class="day">${showMonth?MONTHS_SHORT[month]+' '+(year)+'<br>':''}${dayLabel(t.d)}</div>`}
    <div class="body">
      <div class="ttext">${esc(t.text)}</div>
      <div class="meta">${noDay && t.d[0]!==t.d[1]?`<span class="tag">${dayLabel(t.d)}</span>`:''}${who}${t.frist?'<span class="tag frist">Frist</span>':''}${t.fungi?'<span class="tag fungi">Fungizid</span>':''}${place?`<span class="tag">${esc(place.place)}</span>`:''}${isAuto(t)?'<span class="tag auto">aus Spielstand</span>':''}${t.fields.length>1?`<span class="muted small">${a}/${b} Felder · ${fmtHa(haSum)}</span>`:(haSum?`<span class="muted small">${fmtHa(haSum)}</span>`:'')}
        ${compact?'':`<button class="linkbtn" data-action="note" data-key="${esc(t.key)}">${note!=null?'Notiz':'+ Notiz'}</button>`}
        ${t.custom && !compact?`<button class="linkbtn" data-action="delCustom" data-id="${t.custom.id}">löschen</button>`:''}</div>
      ${t.fields.length?`<div class="chips">${chips}</div>`:''}
      ${note!=null && !compact?`<textarea data-action="noteText" data-key="${esc(t.key)}" placeholder="Notiz…">${esc(note)}</textarea>`:''}
      ${note && compact?`<div class="muted small" style="margin-top:4px">📝 ${esc(note)}</div>`:''}
    </div>
  </div>`;
}

function findTask(key){
  const abs = parseInt(key.split('|')[0],10);
  return tasksFor(abs).find(t=>t.key===key);
}
function setDone(task, fid, val, auto=false){
  const k = doneKey(task,fid);
  if(val) state.done[k] = {at:Date.now(), ...(auto?{auto:true}:{})}; else delete state.done[k];
}
function stepDay(dir){
  const g = state.game;
  let abs = nowAbs(), day = g.day + dir;
  if(day > g.dpp){ day = 1; abs++; }
  if(day < 1){ day = g.dpp; abs--; }
  const f = fromAbs(abs);
  Object.assign(g, {day, month:f.month, year:Math.max(1,f.year)});
}

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-action]');
  if(!el || el.tagName==='SELECT' || (el.tagName==='INPUT' && el.type!=='checkbox')) return;
  const a = el.dataset.action;
  if(a==='tab'){ state.ui.tab = el.dataset.tab; if(el.dataset.tab==='work') state.ui.viewAbs = null; save(); render(); window.scrollTo(0,0); }
  else if(a==='sync') doSync(false);
  else if(a==='pickFolder') doSync(true);
  else if(a==='day'){ stepDay(+el.dataset.dir); save(); render(); }
  else if(a==='viewMonth'){ const d = +el.dataset.dir; state.ui.viewAbs = d===0 ? null : Math.max(START_ABS, (state.ui.viewAbs ?? nowAbs()) + d); save(); render(); }
  else if(a==='toggleTask'){ const t = findTask(el.dataset.key); if(!t) return; const val = !isTaskDone(t); if(t.fields.length) t.fields.forEach(f=>setDone(t,f.id,val)); else setDone(t,null,val); save(); render(); }
  else if(a==='toggleField'){ const t = findTask(el.dataset.key); if(!t) return; const fid = +el.dataset.fid; setDone(t, fid, !isFieldDone(t,fid)); save(); render(); }
  else if(a==='note'){ const k = el.dataset.key; if(state.notes[k]==null) state.notes[k] = ''; else if(!state.notes[k]) delete state.notes[k]; save(); render(); }
  else if(a==='delCustom'){ if(confirm('Eigene Aufgabe löschen?')){ state.custom = state.custom.filter(c=>c.id!==el.dataset.id); save(); render(); } }
  else if(a==='export') exportJson();
  else if(a==='import') document.getElementById('importInput').click();
  else if(a==='reset'){ if(confirm('Alle Häkchen, Notizen, eigenen Aufgaben und Einstellungen löschen?')){ state = defaultState(); save(); render(); } }
});
document.addEventListener('change', e=>{
  const el = e.target, a = el.dataset.action; if(!a) return;
  const g = state.game;
  if(a==='setMonth'){ g.month = +el.value; }
  else if(a==='setDay'){ g.day = +el.value; }
  else if(a==='setYear'){ g.year = Math.max(1, parseInt(el.value,10)||1); }
  else if(a==='setDpp'){ g.dpp = +el.value; g.day = Math.min(g.day, g.dpp); }
  else if(a==='setOffset'){ state.monthOffset = parseInt(el.value,10)||0; }
  else if(a==='setHa'){ const v = parseFloat(el.value); const f = fieldById(+el.dataset.fid); if(isNaN(v) || v===f.ha) delete state.haOverride[f.id]; else state.haOverride[f.id] = v; }
  else if(a==='rtField'){
    let v = el.value;
    if(v==='__other'){ v = prompt('Nummer des NPC-Felds:'); if(!v){ render(); return; } }
    const id = parseInt(v,10); if(!id){ render(); return; }
    const s = state.rt[el.dataset.slot]; s.field = id;
    const def = Object.values(RT_DEFAULT).find(d=>d.field===id); s.ha = def ? def.ha : (state.sync?.farmlandHa?.[id] ?? s.ha);
  }
  else if(a==='rtHa'){ state.rt[el.dataset.slot].ha = parseFloat(el.value)||null; }
  else return;
  save(); render();
});
document.addEventListener('input', e=>{
  const el = e.target; if(el.dataset.action==='noteText'){ state.notes[el.dataset.key] = el.value; save(); }
});
document.addEventListener('submit', e=>{
  const f = e.target; if(f.dataset.form!=='custom') return;
  e.preventDefault();
  const fd = new FormData(f);
  const abs = state.ui.viewAbs ?? nowAbs();
  const {month} = fromAbs(abs);
  const fields = String(fd.get('fields')||'').split(/[,;\s]+/).map(x=>parseInt(x,10)).filter(Boolean);
  state.custom.push({id:Date.now().toString(36), abs, month, day:+fd.get('day'), text:String(fd.get('text')).trim(), who:fd.get('who'), fields, repeat:!!fd.get('repeat')});
  save(); render(); toast('Aufgabe hinzugefügt');
});
document.getElementById('importInput').addEventListener('change', async e=>{
  const file = e.target.files[0]; if(!file) return;
  try{ const s = JSON.parse(await file.text()); if(s.v!==1) throw 0; state = Object.assign(defaultState(), s); save(); render(); toast('Daten geladen'); }
  catch(err){ toast('Die Datei ist keine gültige Sicherung.'); }

});
function exportJson(){
  const blob = new Blob([JSON.stringify(state,null,1)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `hof-koprek-${new Date().toISOString().slice(0,10)}.json`; a.click();

}
let toastTimer;
function toast(msg){
  let t = document.querySelector('.toast'); if(!t){ t = document.createElement('div'); t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.remove(), 3500);
}

/* =====================================================================
   Synchronisieren: Ordnerzugriff + XML lesen
   ===================================================================== */
const idb = {
  open(){ return new Promise((res,rej)=>{ const r = indexedDB.open('ls25-manager',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  async get(k){ try{ const db = await this.open(); return await new Promise(res=>{ const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(null); }); }catch(e){ return null; } },
  async set(k,v){ try{ const db = await this.open(); await new Promise(res=>{ const t = db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=res; t.onerror=res; }); }catch(e){} },
};

async function doSync(forcePick){
  try{
    if(!('showDirectoryPicker' in window)){ document.getElementById('dirInput').click(); return; }
    let dir = forcePick ? null : await idb.get('dir');
    if(dir){
      let p = await dir.queryPermission({mode:'read'});
      if(p!=='granted') p = await dir.requestPermission({mode:'read'});
      if(p!=='granted') dir = null;
    }
    if(!dir){
      dir = await window.showDirectoryPicker({id:'ls25-savegame', mode:'read', startIn:'documents'});
      await idb.set('dir', dir);
    }
    const files = [];
    for await (const [name, h] of dir.entries()){
      if(h.kind==='file' && /\.xml$/i.test(name)){ const f = await h.getFile(); files.push({name, size:f.size, text: await f.text()}); }
    }
    ingest(dir.name, files);
  }catch(err){
    if(err && err.name==='AbortError') return;
    console.error(err); toast('Sync fehlgeschlagen: '+(err.message||err));
  }
}
document.getElementById('dirInput').addEventListener('change', async e=>{
  const list = [...e.target.files].filter(f=>/\.xml$/i.test(f.name) && f.webkitRelativePath.split('/').length===2);
  const folder = list[0]?.webkitRelativePath.split('/')[0] || 'Ordner';
  const files = await Promise.all(list.map(async f=>({name:f.name, size:f.size, text:await f.text()})));
  e.target.value=''; ingest(folder, files);
});

const parseXml = txt => { const d = new DOMParser().parseFromString(String(txt).replace(/^\uFEFF/,'').trimStart(), 'application/xml'); return d.getElementsByTagName('parsererror').length ? null : d; };
const firstText = (doc, tags) => { for(const t of tags){ const el = doc.getElementsByTagName(t)[0]; if(el && el.textContent.trim()!=='') return el.textContent.trim(); } return null; };
const num = v => { const n = parseFloat(v); return isNaN(n) ? null : n; };
const bool = v => v==null ? null : /^(true|1|yes|on)$/i.test(String(v).trim());
function econName(v){
  if(v==null) return null;
  const s = String(v).trim().toUpperCase();
  return ({'1':'Einfach','EASY':'Einfach','2':'Normal','NORMAL':'Normal','3':'Schwer','HARD':'Schwer'})[s] || v;
}

function ingest(folder, files){
  const byName = {}; files.forEach(f=>byName[f.name.toLowerCase()] = f);
  const use = (name, what) => { const f = byName[name]; if(f) f.use = (f.use?f.use+', ':'')+what; };
  const warnings = [];
  if(!byName['careersavegame.xml']){ toast('In diesem Ordner liegt keine careerSavegame.xml – ist das ein Spielstand-Ordner?'); return; }
  const out = {at:Date.now(), folder, files:[], settings:{}, env:{}, money:null, farmName:null, ownedFarmlands:[], npcFarmlands:[], fields:{}, animals:null, vehicles:null, placeables:[], mods:[], warnings};

  // careerSavegame.xml
  const cs = parseXml(byName['careersavegame.xml'].text);
  if(cs){
    out.settings = {
      savegameName: firstText(cs,['savegameName']),
      mapTitle: firstText(cs,['mapTitle']),
      mapId: firstText(cs,['mapId']),
      econ: econName(firstText(cs,['economicDifficulty','difficulty'])),
      stones: bool(firstText(cs,['stonesEnabled'])),
      plannedDpp: num(firstText(cs,['plannedDaysPerPeriod'])),
    };
    out.money = num(firstText(cs,['money']));
    use('careersavegame.xml','Einstellungen, Karte');
    const map = (out.settings.mapId||'')+' '+(out.settings.mapTitle||'');
    if(map.trim() && !/mittellandkanal|MLK/i.test(map)) warnings.push(`Dieser Spielstand gehört zur Karte „${out.settings.mapTitle||out.settings.mapId}“, nicht zu Am Mittellandkanal. Richtig ist savegame2.`);
  }

  // environment.xml → Datum
  if(byName['environment.xml']){
    const env = parseXml(byName['environment.xml'].text);
    if(env){
      const currentDay = num(firstText(env,['currentDay']));
      const dpp = num(firstText(env,['daysPerPeriod'])) || out.settings.plannedDpp || 1;
      const period = num(firstText(env,['currentPeriod']));
      out.env = {currentDay, dpp, period};
      if(currentDay!=null){
        const d0 = currentDay-1;
        let year = Math.floor(d0/(dpp*12))+1;
        let per = period || (Math.floor(d0/dpp)%12)+1;   // 1 = März
        const day = (d0 % dpp)+1;
        let month = (per+1)%12+1;
        if(state.monthOffset){
          const abs = toAbs(year, month) + state.monthOffset; const f = fromAbs(abs); month = f.month; year = Math.max(1,f.year);
        }
        state.game = {year, month, day, dpp};
        use('environment.xml','Datum (Monat, Tag, Jahr)');
      }
    }
  } else warnings.push('environment.xml fehlt – Datum nicht gelesen.');

  // farms.xml
  if(byName['farms.xml']){
    const d = parseXml(byName['farms.xml'].text);
    const farm = d && [...d.getElementsByTagName('farm')].find(f=>f.getAttribute('farmId')==='1');
    if(farm){ out.farmName = farm.getAttribute('name'); const m = num(farm.getAttribute('money')); if(m!=null) out.money = m; use('farms.xml','Betrieb, Kontostand'); }
  }

  // farmland.xml
  if(byName['farmland.xml']){
    const d = parseXml(byName['farmland.xml'].text);
    if(d){
      [...d.getElementsByTagName('farmland')].forEach(fl=>{
        const id = parseInt(fl.getAttribute('id'),10), farm = fl.getAttribute('farmId');
        if(!id) return;
        if(farm==='1') out.ownedFarmlands.push(id); else if(farm==='0' || farm==null) out.npcFarmlands.push(id);
      });
      use('farmland.xml','Besitz der Felder, NPC-Felder');
    }
  }

  // fields.xml
  if(byName['fields.xml']){
    const d = parseXml(byName['fields.xml'].text);
    if(d){
      [...d.getElementsByTagName('field')].forEach(el=>{
        const id = parseInt(el.getAttribute('id'),10); if(!id) return;
        const attrs = {}; [...el.attributes].forEach(a=>{ if(a.name!=='id') attrs[a.name] = a.value; });
        [...el.children].forEach(c=>{ if(!c.children.length && c.textContent.trim()) attrs[c.tagName] = c.textContent.trim(); });
        out.fields[id] = attrs;
      });
      use('fields.xml','Feldinfos');
    }
  }

  // placeables.xml → Tiere, Silo
  if(byName['placeables.xml']){
    const d = parseXml(byName['placeables.xml'].text);
    if(d){
      let cattle = 0, total = 0; const stock = {};
      [...d.getElementsByTagName('placeable')].forEach(p=>{
        if(p.getAttribute('farmId')!=='1') return;
        const fn = p.getAttribute('filename')||''; out.placeables.push((p.getAttribute('modName')||'')+'/'+fn.split('/').pop());
        p.querySelectorAll('[fillType][fillLevel]').forEach(n=>{
          if(n.closest('husbandryMeadow')) return;
          const ft = n.getAttribute('fillType'), lvl = num(n.getAttribute('fillLevel'));
          if(ft && lvl>0) stock[ft] = (stock[ft]||0) + lvl;
        });
        [...p.getElementsByTagName('animal')].forEach(a=>{
          const n = num(a.getAttribute('numAnimals')) ?? 1;
          const type = (a.getAttribute('subType')||a.getAttribute('type')||'')+' '+fn;
          total += n; if(/cow|angus|cattle|rind|kuh/i.test(type)) cattle += n;
        });
      });
      out.animals = {cattle, total};
      out.stock = stock;
      use('placeables.xml','Gebäude, Tiere, Lagerbestände');
    }
  }

  // vehicles.xml
  if(byName['vehicles.xml']){
    const d = parseXml(byName['vehicles.xml'].text);
    if(d){ out.vehicles = [...d.getElementsByTagName('vehicle')].filter(v=>!v.getAttribute('farmId') || v.getAttribute('farmId')==='1').length; use('vehicles.xml','Anzahl Fahrzeuge'); }
  }

  // Mod-Dateien: alles mit Feld-/Farmland-Bezug
  files.forEach(f=>{
    const n = f.name.toLowerCase();
    if(!/leas|pacht|ringtausch|rotation|croprot|fruchtfolge/.test(n)) return;
    const d = parseXml(f.text); if(!d) return;
    const entries = [];
    d.querySelectorAll('*').forEach(el=>{
      const attrs = {}; [...el.attributes].forEach(a=>attrs[a.name]=a.value);
      el.childNodes.forEach && [...el.children].forEach(c=>{ if(!c.children.length && c.textContent.trim().length<40) attrs[c.tagName] = c.textContent.trim(); });
      const ids = [];
      Object.entries(attrs).forEach(([k,v])=>{ if(/^(farmland|field)(_?id|index|no|nr)?$/i.test(k) || /(farmland|field)(_?id)$/i.test(k)) { const x = parseInt(v,10); if(x) ids.push(x); } });
      if(!ids.length && /field|farmland|lease|contract/i.test(el.tagName) && attrs.id){ const x = parseInt(attrs.id,10); if(x) ids.push(x); }
      if(ids.length) entries.push({tag:el.tagName, attrs, fieldIds:[...new Set(ids)]});
    });
    out.mods.push({file:f.name, entries, head:f.text.slice(0,1500)});
    f.use = /leas|pacht|ringtausch/.test(n) ? 'Ringtausch-Verträge (Mod)' : 'Fruchtfolge (Mod)';
  });

  out.files = files.map(f=>({name:f.name, size:f.size, use:f.use||''})).sort((a,b)=>(b.use?1:0)-(a.use?1:0) || a.name.localeCompare(b.name));
  state.sync = out;
  applyAutoDone();
  state.ui.viewAbs = null;
  save(); render();
  toast(`Synchronisiert: ${fmtDate()}`);
}

/* Erledigtes aus dem Spielstand ableiten (nur setzen, nie löschen) */
function applyAutoDone(){
  const s = state.sync; if(!s) return;
  const owned = new Set(s.ownedFarmlands);
  const modIds = new Set(s.mods.filter(m=>/leas|pacht|ringtausch/i.test(m.file)).flatMap(m=>m.entries.flatMap(e=>e.fieldIds)));
  const now = nowAbs(), {month} = fromAbs(now);
  for(let a = START_ABS; a <= now; a++){
    tasksFor(a).forEach(t=>{
      const mark = fid => { if(!isFieldDone(t,fid)) setDone(t,fid,true,true); };
      if(t.auto==='settings' && s.env?.dpp===PLAN_SETTINGS.dpp && s.settings.econ===PLAN_SETTINGS.econ && s.settings.stones===false) mark(null);
      if(t.auto==='cattle' && (s.animals?.cattle||0) >= 10) mark(null);
      const sameSeason = fromAbs(a).sy===fromAbs(now).sy;
      if(t.auto==='silo' && s.placeables.some(p=>/bunker.?silo/i.test(p))) t.fields.forEach(f=>mark(f.id));
      if(t.auto==='contracts') t.fields.forEach(f=>{ if(modIds.has(f.id)) mark(f.id); });
      if(t.auto==='rtTakeover' && sameSeason) t.fields.forEach(f=>{ if(owned.has(f.id)) mark(f.id); });
      if(t.auto==='rtReturn' && sameSeason && month>=11) t.fields.forEach(f=>{ if(!owned.has(f.id)) mark(f.id); });
    });
  }
}

// Für Tests
window.__ls25 = {ingest, tasksFor, fromAbs, toAbs, get state(){return state;}};
render();
</script>
